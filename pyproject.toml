[project]
name = "community-bot"
version = "0.1.0"
description = "Slack onboarding and archive bot for a community workspace"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "apscheduler>=3.11.3",
    "pydantic-settings>=2.7.0",
    "slack-bolt>=1.22.0",
    "sqlalchemy>=2.0.36",
]

[project.scripts]
community-bot = "community_bot.main:main"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.9.0",
    "ty>=0.0.1a1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
